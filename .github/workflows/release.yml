name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: pfarrtools/pfarrplaner

jobs:
  production-image:
    name: Produktionsimage veröffentlichen
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Quelltext des Release-Tags auschecken
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v4

      - name: Bei Docker Hub anmelden
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Produktionsimage bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manual:
    name: Handbuch bauen und veröffentlichen
    runs-on: ubuntu-latest
    steps:
      - name: Quelltext des Release-Tags auschecken
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: CI-Testumgebung konfigurieren
        run: |
          cp .env.example .env
          sed -i \
            -e 's/^APP_ENV=.*/APP_ENV=local/' \
            -e 's/^APP_KEY=.*/APP_KEY=base64:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=/' \
            -e 's#^APP_URL=.*#APP_URL=http://web#' \
            -e 's/^DB_PASSWORD=.*/DB_PASSWORD=pfarrplaner/' \
            -e 's/^DB_ROOT_PASSWORD=.*/DB_ROOT_PASSWORD=root/' \
            -e 's/^REDIS_PASSWORD=.*/REDIS_PASSWORD=pfarrplaner-development-redis/' \
            .env

      - name: Entwicklungsdienste bauen
        run: docker compose -f compose.yaml build app vite manual create-buckets

      - name: Entwicklungsumgebung starten
        run: ./planer dev up -d --remove-orphans

      - name: Manual-Webserver prüfen
        run: |
          for attempt in {1..30}; do
            if docker compose -f compose.yaml exec -T app curl --fail --silent http://web/api/health; then
              exit 0
            fi
            sleep 1
          done
          echo 'Der Manual-Webserver wurde innerhalb von 30 Sekunden nicht erreichbar.' >&2
          exit 1

      - name: Manual-Webserver bei Fehler diagnostizieren
        if: failure()
        run: |
          docker compose -f compose.yaml ps
          docker compose -f compose.yaml exec -T app getent hosts web app || true
          docker compose -f compose.yaml exec -T app php -r '$socket = @fsockopen("app", 9000, $errno, $error); echo $socket ? "FPM erreichbar\n" : "FPM fehlgeschlagen: {$errno} {$error}\n"; if (is_resource($socket)) { fclose($socket); }'
          docker compose -f compose.yaml exec -T app sh -lc 'curl -sS -D - --max-time 10 http://web/api/health || true; curl -sS -D - --max-time 10 http://web/ || true'
          docker compose -f compose.yaml logs --no-color --tail=200 web app

      - name: Manual einschließlich Dusk bauen
        env:
          PFARRPLANER_MANUAL_APP_URL: http://127.0.0.1:8000
        run: ./planer dev manual all

      - name: SSH-Agent für Manual-Deployment einrichten
        if: github.event_name == 'push'
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.MANUAL_DEPLOY_SSH_KEY }}

      - name: SSH-Hostschlüssel konfigurieren
        if: github.event_name == 'push'
        env:
          MANUAL_DEPLOY_KNOWN_HOSTS: ${{ secrets.MANUAL_DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$MANUAL_DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Manual veröffentlichen
        if: github.event_name == 'push'
        env:
          MANUAL_DEPLOY_USER: ${{ vars.MANUAL_DEPLOY_USER }}
          MANUAL_DEPLOY_HOST: ${{ vars.MANUAL_DEPLOY_HOST }}
          MANUAL_DEPLOY_PATH: ${{ vars.MANUAL_DEPLOY_PATH }}
        run: ./planer dev manual deploy

      - name: Entwicklungsumgebung beenden
        if: always()
        run: ./planer dev down -v

  deploy-production:
    name: Produktionshosts aktualisieren
    if: github.event_name == 'push'
    needs: [production-image, manual]
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJSON(vars.PRODUCTION_HOSTS) }}
    steps:
      - name: SSH-Agent für Produktionsdeployment einrichten
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_DEPLOY_SSH_KEY }}

      - name: Produktions-Hostschlüssel konfigurieren
        env:
          PRODUCTION_DEPLOY_KNOWN_HOSTS: ${{ secrets.PRODUCTION_DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Produktionshost aktualisieren
        env:
          DEPLOY_USER: ${{ matrix.user }}
          DEPLOY_HOST: ${{ matrix.host }}
          DEPLOY_PATH: ${{ matrix.path }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf -v quoted_path '%q' "$DEPLOY_PATH"
          remote_command="cd -- $quoted_path && ./planer prod backup create && ./planer prod update --ref '$RELEASE_TAG' --backup-confirmed && ./planer prod ps"
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command"
