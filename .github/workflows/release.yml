name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: pfarrtools/pfarrplaner

jobs:
  production-image:
    name: Produktionsimage veröffentlichen
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Quelltext des Release-Tags auschecken
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v4

      - name: Bei Docker Hub anmelden
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Produktionsimage bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manual:
    name: Handbuch bauen und veröffentlichen
    runs-on: ubuntu-latest
    steps:
      - name: Quelltext des Release-Tags auschecken
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Entwicklungsdienste bauen
        run: docker compose -f compose.yaml build app vite manual create-buckets

      - name: Entwicklungsumgebung starten
        run: ./planer dev up -d --remove-orphans

      - name: Manual einschließlich Dusk bauen
        run: ./planer dev manual all

      - name: SSH-Agent für Manual-Deployment einrichten
        if: github.event_name == 'push'
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.MANUAL_DEPLOY_SSH_KEY }}

      - name: SSH-Hostschlüssel konfigurieren
        if: github.event_name == 'push'
        env:
          MANUAL_DEPLOY_KNOWN_HOSTS: ${{ secrets.MANUAL_DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$MANUAL_DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Manual veröffentlichen
        if: github.event_name == 'push'
        env:
          MANUAL_DEPLOY_USER: ${{ vars.MANUAL_DEPLOY_USER }}
          MANUAL_DEPLOY_HOST: ${{ vars.MANUAL_DEPLOY_HOST }}
          MANUAL_DEPLOY_PATH: ${{ vars.MANUAL_DEPLOY_PATH }}
        run: ./planer dev manual deploy

      - name: Entwicklungsumgebung beenden
        if: always()
        run: ./planer dev down -v
