name: pfarrplaner

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
    target: development
  working_dir: /var/www/html
  env_file:
    - path: .env
      required: false
  volumes:
    - ./src:/var/www/html
    - ./docs/manual:/var/www/docs/manual
    - ./backups:/var/backups/pfarrplaner
    - composer_cache:/tmp/composer-cache
  depends_on:
    mariadb: {condition: service_healthy}
    redis: {condition: service_healthy}
    minio: {condition: service_started}
  networks: [pfarrplaner]

services:
  app:
    <<: *app
    command: >-
      sh -lc "chmod -R a+rwX storage bootstrap/cache /var/backups/pfarrplaner &&
      (php artisan config:clear >/dev/null 2>&1 || true);
      exec php-fpm8.4 -F"
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    image: caddy:2-alpine
    ports: ["${APP_PORT:-8080}:80"]
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: {app: {condition: service_healthy}}
    networks: [pfarrplaner]
  vite:
    build: {context: ., dockerfile: Dockerfile, target: node}
    working_dir: /app
    env_file:
      - path: .env
        required: false
    command: sh -lc "npm run dev -- --host 0.0.0.0"
    ports: ["${VITE_PORT:-5173}:5173"]
    volumes: ["./src:/app", "node_modules:/app/node_modules"]
    networks: [pfarrplaner]
  horizon:
    <<: *app
    command: sh -lc "php artisan horizon"
    restart: unless-stopped
  scheduler:
    <<: *app
    command: sh -lc "php artisan schedule:work"
    restart: unless-stopped
  mariadb:
    image: mariadb:11
    command: ["--max_allowed_packet=256M"]
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-pfarrplaner}
      MARIADB_USER: ${DB_USERNAME:-pfarrplaner}
      MARIADB_PASSWORD: ${DB_PASSWORD:-pfarrplaner}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports: ["${FORWARD_DB_PORT:-3306}:3306"]
    volumes: ["mariadb_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p\"$$MARIADB_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [pfarrplaner]
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes", --requirepass, "${REDIS_PASSWORD:-pfarrplaner-development-redis}"]
    env_file:
      - path: .env
        required: false
    volumes: [redis_data:/data]
    healthcheck: {test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"], interval: 5s, timeout: 3s, retries: 20}
    networks: [pfarrplaner]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-pfarrplaner}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-pfarrplaner-development-secret}
    ports:
      - "${FORWARD_S3_PORT:-9000}:9000"
      - "${FORWARD_S3_CONSOLE_PORT:-9001}:9001"
    volumes: [minio_data:/data]
    networks: [pfarrplaner]
  create-buckets:
    image: minio/mc:latest
    env_file:
      - path: .env
        required: false
    entrypoint: >-
      /bin/sh -lc 'until mc alias set local http://minio:9000
      "$${AWS_ACCESS_KEY_ID:-pfarrplaner}" "$${AWS_SECRET_ACCESS_KEY:-pfarrplaner-development-secret}"; do sleep 2; done;
      mc mb --ignore-existing local/$${AWS_BUCKET:-pfarrplaner};
      mc mb --ignore-existing local/$${MINIO_BACKUP_BUCKET:-pfarrplaner-backups};'
    depends_on: {minio: {condition: service_started}}
    networks: [pfarrplaner]
  soketi:
    image: quay.io/soketi/soketi:latest
    environment:
      SOKETI_DEBUG: "${SOKETI_DEBUG:-0}"
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID:-pfarrplaner}
      SOKETI_DEFAULT_APP_KEY: ${PUSHER_APP_KEY:-pfarrplaner}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_APP_SECRET:-pfarrplaner}
    ports: ["${SOKETI_PORT:-6001}:6001"]
    networks: [pfarrplaner]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["${FORWARD_MAILPIT_PORT:-8025}:8025"]
    networks: [pfarrplaner]

networks:
  pfarrplaner: {driver: bridge}
volumes:
  mariadb_data:
  redis_data:
  minio_data:
  composer_cache:
  node_modules:
  caddy_data:
  caddy_config:
